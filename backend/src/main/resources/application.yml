spring:
  application:
    name: sistema-hr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistemahr}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:SistemaHRJwtSecretKeyForDevelopmentOnlyChangeMe123456789}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload-dir: ${UPLOAD_DIR:uploads}
  attendance:
    start-time: ${ATTENDANCE_START_TIME:09:00}
    late-tolerance-minutes: ${ATTENDANCE_LATE_TOLERANCE_MINUTES:10}

