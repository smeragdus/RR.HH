spring:
  application:
    name: RRHH Backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rrhh_db}
    username: ${SPRING_DATASOURCE_USERNAME:rrhh_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rrhh_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:miSecretKeyParaJWTSuperSegura2024QueDebeSerMuyLarga!}
  expiration: 86400000  # 24 horas en milisegundos

logging:
  level:
    root: INFO
    com.rrhh: DEBUG
    org.springframework.security: INFO
