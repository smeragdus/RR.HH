services:
  postgres:
    image: postgres:16
    container_name: sistemahr-postgres
    environment:
      POSTGRES_DB: sistemahr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - sistemahr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistemahr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: sistemahr-backend
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sistemahr
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: SistemaHRJwtSecretKeyForDevelopmentOnlyChangeMe123456789
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: mvn spring-boot:run -Dfrontend.skip=true
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app/backend
      - sistemahr-uploads:/app/uploads
      - maven-cache:/root/.m2

  frontend:
    image: node:22-alpine
    container_name: sistemahr-frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  sistemahr-postgres:
  sistemahr-uploads:
  maven-cache:
  frontend-node-modules:
