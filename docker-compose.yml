services:
  postgres:
    image: postgres:16
    container_name: sistemahr-postgres
    environment:
      POSTGRES_DB: sistemahr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - sistemahr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistemahr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sistemahr-postgres:
